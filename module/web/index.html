<!DOCTYPE html>
<!--
  ipxbox web dashboard (read-only).
  Copyright (C) 2025-2026 Daniel Arnold. Part of a community fork of ipxbox.
  GPL-2.0-or-later. Single self-contained page, embedded via go:embed.
  Talks to the server over /api/topology and /events (SSE).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ipxbox</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --ink:#e6edf3; --muted:#8b98a5;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#2f81f7; --line:#232a33; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; } header .sp { flex:1; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .sub { color:var(--muted); font-size:12px; }
  main { padding:20px; max-width:1000px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .card .value { font-size:26px; font-weight:700; margin-top:4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .panel h2 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; padding:4px 6px; }
  td { padding:5px 6px; border-top:1px solid var(--line); }
  .pill { font-size:11px; padding:1px 7px; border-radius:10px; }
  .active { color:var(--accent); background:rgba(47,129,247,.12); }
  .idle   { color:var(--warn); background:rgba(210,153,34,.12); }
  .stale  { color:var(--muted); background:rgba(139,152,165,.12); }
  svg.topo { width:100%; height:300px; display:block; }
  .legend { font-size:11px; color:var(--muted); display:flex; gap:14px; margin-top:6px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  footer { color:var(--muted); font-size:12px; padding:16px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>ipxbox</h1><span class="sub">server dashboard</span>
  <span class="sp"></span>
  <span id="live" class="sub mono">● connecting…</span>
</header>

<main>
  <div class="cards">
    <div class="card"><div class="label">Clients</div><div id="nNodes" class="value">0</div></div>
    <div class="card"><div class="label">Active now</div><div id="nActive" class="value">0</div></div>
    <div class="card"><div class="label">Links</div><div id="nEdges" class="value">0</div></div>
    <div class="card"><div class="label">Packets seen</div><div id="nPkts" class="value">0</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Connected clients</h2>
      <table>
        <thead><tr><th>Node</th><th>Packets</th><th>State</th></tr></thead>
        <tbody id="roster"><tr><td colspan="3" class="sub">none yet</td></tr></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Topology (who is talking to whom)</h2>
      <svg class="topo" id="graph" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>node</span>
        <span><i style="background:var(--accent)"></i>active link</span>
        <span><i style="background:var(--muted)"></i>idle/stale</span>
      </div>
    </div>
  </div>
</main>
<footer>ipxbox — IPX over UDP. Topology inferred from observed traffic.</footer>

<script>
const $ = id => document.getElementById(id);
let topo = {nodes:[], edges:[]};

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function shortNode(n){ return n ? n.slice(-5) : "?"; }

function render() {
  const nodes = topo.nodes||[], edges = topo.edges||[];
  $("nNodes").textContent = nodes.length;
  $("nActive").textContent = nodes.filter(n=>n.liveness==="active").length;
  $("nEdges").textContent = edges.length;
  $("nPkts").textContent = nodes.reduce((a,n)=>a+(n.packets||0),0);

  $("roster").innerHTML = nodes.length
    ? nodes.map(n=>`<tr><td class="mono">${esc(n.node)}</td><td>${n.packets}</td>`+
                   `<td><span class="pill ${n.liveness}">${n.liveness}</span></td></tr>`).join("")
    : `<tr><td colspan="3" class="sub">none yet</td></tr>`;

  drawGraph(nodes, edges);
}

function drawGraph(nodes, edges) {
  const svg = $("graph"), W=400, H=300, cx=W/2, cy=H/2, R=Math.min(W,H)/2-50;
  const idx = {}; nodes.forEach((n,i)=>idx[n.node]=i);
  const pos = nodes.map((n,i)=>{ const a=(i/Math.max(1,nodes.length))*2*Math.PI - Math.PI/2;
    return {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  const col = lv => lv==="active"?"var(--accent)":(lv==="idle"?"#3a4654":"#2a313b");
  let out = "";
  for (const e of edges) {
    const a=idx[e.a], b=idx[e.b]; if(a==null||b==null) continue;
    out += `<line x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}" `+
           `stroke="${col(e.liveness)}" stroke-width="${e.liveness==="active"?2.5:1}">`+
           `<title>${esc(e.a)} ↔ ${esc(e.b)} — ${e.liveness}, ${e.packets} pkts</title></line>`;
  }
  nodes.forEach((n,i)=>{
    out += `<g><circle cx="${pos[i].x}" cy="${pos[i].y}" r="8" fill="var(--accent)" `+
           `stroke="${n.liveness==="active"?"#fff":"transparent"}" stroke-width="1.5" `+
           `opacity="${n.liveness==="stale"?0.45:1}"/>`+
           `<text x="${pos[i].x}" y="${pos[i].y-12}" fill="var(--ink)" font-size="10" text-anchor="middle">${shortNode(n.node)}</text>`+
           `<title>${esc(n.node)} — ${n.liveness}, ${n.packets} pkts</title></g>`;
  });
  if (!nodes.length) out = `<text x="${cx}" y="${cy}" fill="var(--muted)" font-size="12" text-anchor="middle">no traffic observed yet</text>`;
  svg.innerHTML = out;
}

function setLive(s){ const el=$("live");
  if(s==="on"){el.textContent="● live";el.style.color="var(--ok)";}
  else if(s==="off"){el.textContent="● disconnected";el.style.color="var(--bad)";}
  else{el.textContent="● connecting…";el.style.color="var(--muted)";} }

(function connect(){
  const es = new EventSource("/events");
  es.onopen = ()=>setLive("on");
  es.onerror = ()=>setLive("off");
  es.addEventListener("topology", e => { topo = JSON.parse(e.data); render(); });
})();
</script>
</body>
</html>
